<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <script>
      // Dynamically set manifest based on current path
      (function() {
        const path = window.location.pathname;
        let manifestPath = '/manifest.json'; // default to dashboard
        let appTitle = 'Sage Dashboard';

        if (path.startsWith('/chat')) {
          manifestPath = '/chat-manifest.json';
          appTitle = 'Sage Chat';
        } else if (path.startsWith('/voice')) {
          manifestPath = '/voice-manifest.json';
          appTitle = 'Sage Voice';
        }

        // Create and append manifest link
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestPath;
        document.head.appendChild(link);

        // Set page title
        document.title = appTitle;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Sage" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
